name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: packages/mcp-files/package-lock.json
      - name: Check docs contract
        run: node scripts/check-docs.mjs
      - name: Check builder skill contract
        run: node scripts/check-builder-skill.mjs
      - name: Check MANEF module descriptor
        run: node .manef/_generated/check-module.mjs
      - name: Run script tests
        run: node --test scripts/test/*.test.mjs
      - name: Run connector-setup example tests
        run: node --test examples/connector-setup/connector-setup.test.mjs
      - name: Install mcp-files dependencies
        working-directory: packages/mcp-files
        run: npm ci
      - name: Typecheck, test, and build mcp-files
        working-directory: packages/mcp-files
        run: |
          npm run typecheck
          npm run test
          npm run build
